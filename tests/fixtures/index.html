<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>示例网申 · 本地填写体验</title><style>
body{font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#273a30;background:#f4f6f1;margin:0}main{max-width:900px;margin:40px auto;padding:0 25px}h1{font-size:30px;margin-bottom:10px}h2{font-size:19px}header p{color:#84917f;margin-bottom:28px}.badge{font-size:11px;color:#396449;letter-spacing:2px}fieldset{border:1px solid #dce3d7;border-radius:12px;padding:25px;margin:22px 0;background:white}legend{padding:0 10px;font-weight:600;color:#486448}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#62735c}input,select,textarea{border:1px solid #d9e1d4;border-radius:7px;padding:11px;font:inherit;color:#293d2b;background:#fbfcfa}textarea{min-height:85px}.wide{grid-column:1/-1}.inline{flex-direction:row;align-items:center;margin:10px 0}button{border:1px solid #366148;background:#366148;color:white;border-radius:8px;padding:12px 20px;cursor:pointer}button.secondary{background:white;color:#526c50;margin-right:10px}.note{padding:15px;background:#eaf1e4;border-radius:8px;color:#77896d;font-size:12px}#submit-status{margin:15px 0;color:#436444}@media(max-width:600px){.grid{grid-template-columns:1fr}main{margin-top:20px}}
</style></head><body><main><header><span class="badge">LOCAL APPLICATION LAB</span><h1>示例科技 · 校园招聘</h1><p>本地仿真表单，用于体验和验证插件。这里不会发出求职申请。</p></header><div class="note">先在插件中载入并保存示例资料，再扫描本页。两段教育经历需要在侧边栏明确对应。</div>
<form id="application"><fieldset><legend>基本资料</legend><div class="grid">
<label>姓名<input id="full-name" name="full_name" autocomplete="name" required></label><label>手机号<input name="phone" type="tel" autocomplete="tel"></label>
<label>电子邮箱<input name="email" type="email" required></label><label>现居城市<input name="city"></label><label class="wide">求职意向<input name="job_intention"></label></div></fieldset>
<fieldset><legend>教育经历 1</legend><div class="grid"><label>学校名称<input name="school1"></label><label>所学专业<input name="major1"></label><label>学历<select name="level1"><option value="">请选择</option><option value="college">大专</option><option value="undergraduate">本科</option><option value="postgraduate">硕士</option><option value="doctorate">博士</option></select></label><label>已获学位<input name="degree1"></label><label>入学时间<input type="month" name="start1"></label><label>毕业时间<input type="month" name="end1"></label></div></fieldset>
<fieldset><legend>教育经历 2</legend><div class="grid"><label>学校名称<input name="school2"></label><label>所学专业<input name="major2"></label><label>学历<select name="level2"><option value="">请选择</option><option value="undergraduate">本科</option><option value="postgraduate">硕士研究生</option></select></label><label>已获学位<input name="degree2"></label><label>入学时间<input type="month" name="start2"></label><label>毕业时间<input type="month" name="end2"></label></div></fieldset>
<fieldset><legend>实习经历</legend><div class="grid"><label>实习单位<input name="company"></label><label>担任职务<input name="role"></label><label class="wide">工作内容<textarea name="responsibilities"></textarea></label></div></fieldset>
<fieldset><legend>项目经历</legend><div class="grid"><label>项目名称<input name="project"></label><label>项目角色<input name="project_role"></label><label class="wide">项目描述<textarea name="project_desc"></textarea></label></div></fieldset>
<fieldset><legend>专业技能</legend><label class="inline"><input type="checkbox" name="python">Python</label><label class="inline"><input type="checkbox" name="java">Java</label><label class="inline"><input type="checkbox" name="rust">Rust</label></fieldset>
<fieldset><legend>其他信息</legend><div class="grid"><label class="wide">自我评价<textarea name="self_description"></textarea></label><label>密码<input type="password" id="password" value="SYNTHETIC-SECRET"></label><label>短信验证码<input name="otp" value="SYNTHETIC-OTP"></label><label>证件号码<input name="identity" value="SYNTHETIC-ID"></label><label>附件简历<input type="file" name="attachment"></label></div><label class="inline"><input type="checkbox" id="agreement">我已阅读并同意隐私政策</label></fieldset>
<input type="hidden" name="hidden-token" value="SYNTHETIC-HIDDEN"><button type="button" class="secondary" id="rerender">模拟替换姓名字段</button><button type="submit" id="submit">手动提交体验</button><div id="submit-status" role="status"></div></form>
<script>window.__submitted=0;document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();window.__submitted++;document.querySelector('#submit-status').textContent='这是本地体验，未向任何招聘网站提交。'});document.querySelector('#rerender').addEventListener('click',()=>{const old=document.querySelector('#full-name');old.replaceWith(old.cloneNode(true));});</script></main></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>12 复选框基准</title><style>body{font-family:system-ui;margin:32px}main{max-width:760px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{padding:12px;border:1px solid #ccd6e2;border-radius:8px}</style></head><body><main><h1>12 复选框基准</h1><div class="grid" id="options"></div><button id="final" type="button">最终提交（测试不得点击）</button></main><script>const state={finalSubmits:0};options.innerHTML=Array.from({length:12},(_,i)=>`<label><input type="checkbox" aria-label="批量选项 ${i+1}">批量选项 ${i+1}</label>`).join('');final.onclick=()=>state.finalSubmits++;window.CheckboxBenchmark={read:()=>({checked:document.querySelectorAll('input:checked').length,finalSubmits:state.finalSubmits})};</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>高频重渲染控件实验室</title>
</head>
<body>
  <main aria-label="简历表单">
    <section aria-label="基本信息">
      <label for="churn-name">姓名</label>
      <input id="churn-name" autocomplete="name">
    </section>
    <section aria-label="教育信息">
      <button id="churn-add" type="button">添加教育信息</button>
      <output id="churn-output">未点击</output>
    </section>
  </main>
  <script>
    let clickCount = 0;
    const attachButton = button => button.addEventListener('click', () => {
      clickCount += 1;
      document.querySelector('#churn-output').textContent = `已点击 ${clickCount} 次`;
    });
    attachButton(document.querySelector('#churn-add'));

    function replaceControls() {
      const input = document.querySelector('#churn-name');
      const inputReplacement = input.cloneNode(true);
      inputReplacement.value = input.value;
      input.replaceWith(inputReplacement);
      const button = document.querySelector('#churn-add');
      const buttonReplacement = button.cloneNode(true);
      attachButton(buttonReplacement);
      button.replaceWith(buttonReplacement);
    }

    function churnFor(durationMs) {
      const interval = setInterval(replaceControls, 4);
      setTimeout(() => clearInterval(interval), durationMs);
    }

    window.ChurnLab = {
      replaceControls,
      churnFor,
      read() {
        return {
          name: document.querySelector('#churn-name').value,
          clicked: document.querySelector('#churn-output').textContent,
          clickCount,
        };
      },
    };
  </script>
</body>
</html>

<!doctype html><meta charset="utf-8"><title>虚构重复字段实验</title><style>body{font:16px system-ui;padding:20px}fieldset{margin:20px;padding:15px}label{display:block;margin:10px}input{padding:8px}</style><h1>教育资料</h1><div id="root"></div><script>
const layout=new URLSearchParams(location.search).get('layout')||'A',records=layout==='B'?['master','bachelor']:['bachelor','master'];document.querySelector('#root').innerHTML=records.map(id=>`<fieldset data-record="${id}"><legend>${id==='bachelor'?'本科阶段':'研究生阶段'}</legend>${(layout==='B'?['end','start','major','school']:['school','major','start','end']).map(key=>`<label>${({school:'学校',major:'专业',start:'开始时间',end:'结束时间'})[key]}<input data-key="${key}" type="${key==='start'||key==='end'?'month':'text'}"></label>`).join('')}</fieldset>`).join('');window.EvalState=()=>Object.fromEntries([...document.querySelectorAll('fieldset')].map(n=>[n.dataset.record,Object.fromEntries([...n.querySelectorAll('input')].map(i=>[i.dataset.key,i.value]))]));window.submits=0;
</script>

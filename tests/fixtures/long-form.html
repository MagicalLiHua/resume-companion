<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>长页面快照基准</title><style>body{font-family:system-ui;margin:24px}section{max-width:900px;margin:auto}.record{padding:10px;border-bottom:1px solid #ddd}input{margin-left:12px}</style></head><body><section aria-label="大量既有经历"><h1>大量既有经历与少量待填字段</h1><div id="records"></div></section><script>records.innerHTML=Array.from({length:220},(_,i)=>`<div class="record"><label>字段 ${i}<input aria-label="字段 ${i}" value="既有值 ${i}"></label><p>第 ${i} 条虚构经历的说明文本，用于测量长页面快照成本。</p></div>`).join('');</script></body></html>

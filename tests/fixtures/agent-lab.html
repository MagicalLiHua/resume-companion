<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星河银行 · 虚构网申实验室</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#23334a;background:#f4f6fa}body{margin:0}header{background:#102a43;color:white;padding:26px max(24px,calc((100vw - 1040px)/2));display:flex;justify-content:space-between;align-items:center}header small{color:#9dccf5}h1{font-size:25px;margin:6px 0}main{max-width:1040px;margin:28px auto;padding:0 24px}.intro{display:flex;justify-content:space-between;gap:24px}.badge{color:#12654b;background:#e1f4ea;border:1px solid #a2d8c4;padding:8px 14px;border-radius:20px;white-space:nowrap;height:24px}nav{display:flex;gap:12px;margin:26px 0}nav span{padding:10px 18px;border-radius:9px;background:#e6eaf1;font-size:14px}nav .active{background:#2368c4;color:white}.card,section,article{background:white;border:1px solid #dbe3ec;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 2px 8px #102a4305}h2{font-size:19px;margin:0 0 20px}p{line-height:1.6}form{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}label{font-size:14px;display:block}input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;box-sizing:border-box;margin-top:8px;border:1px solid #bccbdd;border-radius:7px;padding:11px;font:inherit;background:white;color:inherit}textarea{min-height:92px}.wide{grid-column:1/-1}button{border:1px solid #b9c9dc;border-radius:8px;padding:10px 17px;font:inherit;cursor:pointer;background:white;color:#294663}button.primary{background:#2368c4;border-color:#2368c4;color:white}button:hover{filter:brightness(.96)}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.hint{color:#63788e;font-size:13px}.error{color:#b43131}dialog{width:min(600px,85vw);border:0;border-radius:14px;padding:28px;box-shadow:0 16px 90px #102a4340}dialog::backdrop{background:#0b203950}dialog h2{margin-top:0}.ant-select-selector{position:relative;cursor:pointer}.ant-select-selection-item{display:block;color:#385a79;font-size:13px}.ant-select-dropdown{position:fixed;z-index:100;left:calc(50% - 275px);top:185px;width:550px;display:flex;gap:8px;background:white;border:1px solid #aabbd0;box-shadow:0 8px 30px #15345430;border-radius:8px;padding:8px}.ant-cascader-menu{flex:1;max-height:210px;overflow:auto;list-style:none;padding:0;margin:0;border-right:1px solid #eee}.ant-cascader-menu-item,.ant-select-item-option{padding:9px;cursor:pointer;border-radius:4px}.ant-cascader-menu-item:hover,.ant-select-item-option:hover{background:#e7f1ff}.ant-cascader-menu-item-active{background:#dceafe}.ant-cascader-menu-item-expand:after{content:'›';float:right}.ant-select-item-option{border-bottom:1px solid #eef2f7}.rc-virtual-list-holder{overflow:auto;max-height:170px;width:100%}.ant-picker-dropdown{position:fixed;z-index:100;top:210px;left:calc(50% - 150px);width:300px;background:white;border:1px solid #aabbd0;border-radius:8px;padding:16px;box-shadow:0 8px 30px #15345430}.ant-picker-body{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ant-picker-cell-inner{padding:10px;cursor:pointer;text-align:center;background:#f1f5fa}.ant-picker-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.record-title{font-weight:650;color:#31587e}.status{font-size:14px;padding:12px;color:#28654a;background:#edf8f1;border-radius:8px}footer{margin:28px 0;color:#6e7f91;font-size:13px}@media(max-width:720px){.grid{grid-template-columns:1fr}.intro{display:block}nav{flex-wrap:wrap}}
</style></head><body><header><div><small>RESUME COMPANION / LOCAL LAB</small><h1>星河银行 · 校园招聘</h1></div><span>虚构数据专用</span></header><main><div class="intro"><div><h2>申请测试开发工程师</h2><p class="hint">在本地复现多步骤、动态学校、重复经历和保存校验。所有公司、职位及示例资料均为虚构。</p></div><span class="badge">本地实验环境</span></div><nav id="steps"></nav><div id="app"></div><footer>这里的保存仅写入此浏览器的本地实验数据。最终“提交申请”仍需用户操作。<span id="variant"></span></footer></main><script src="/test-engine.js"></script><script>
const query=new URLSearchParams(location.search),variant=query.get('layout')||'A',run=query.get('run')||'interactive',key='resume-agent-lab-'+run,mode=query.get('case')||'full';
const empty=()=>({basic:{},education:[],experience:[],draft:null,step:1,finalSubmits:0,nativeSubmits:0});
let state=JSON.parse(localStorage.getItem(key)||'null')||{...empty(),step:Number(query.get('start')||1)}; let counter=0;
const persist=()=>localStorage.setItem(key,JSON.stringify(state));persist();const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.Lab={read:()=>structuredClone(state),reset:()=>{state=empty();persist();render()},variant,run};
if(window.ResumeTest)window.labEngine=new window.ResumeTest.AutomationEngine();
$('variant').textContent=' · 布局 '+variant;
const field=(label,name,type='text',value='',required=true)=>`<label>${label}${required?' *':''}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;
const buttons=(save,next)=>`<div class="actions">${save?'<button type="button" id="draft">保存简历草稿</button>':''}${next?'<button type="button" class="primary" id="next">下一步</button>':''}</div>`;
function rearrange(root){if(variant==='B')root.querySelectorAll('.grid').forEach(grid=>[...grid.children].reverse().forEach(n=>grid.append(n)))}
function render(){
  document.querySelectorAll('dialog,.ant-select-dropdown,.ant-picker-dropdown').forEach(n=>n.remove());
  $('steps').innerHTML=['基本资料','教育背景','工作与实习','核对申请'].map((s,i)=>`<span class="${state.step===i+1?'active':''}">${i+1} · ${s}</span>`).join('');
  if(state.step===1){
    $('app').innerHTML=`<section aria-label="基本资料"><h2>基本资料</h2><form id="basic"><div class="grid">${field(variant==='B'?'真实姓名':'姓名','full_name','text',state.basic.full_name)}${field('电子邮箱','email','email',state.basic.email)}${field('联系电话','phone','tel',state.basic.phone)}${field('现居城市','city','text',state.basic.city)}<label>求职意向<select name="job"><option value="">请选择</option><option value="test">测试开发工程师</option><option value="dev">软件开发工程师</option></select></label><label>可以接受异地办公<input name="relocate" type="checkbox" aria-label="可以接受异地办公"></label><label class="wide">个人简介<textarea name="intro">${esc(state.basic.intro)}</textarea></label></div><p class="hint">测试记录会保留在本浏览器中，字段变更不会投递申请。</p>${buttons(true,true)}<p role="alert" id="errors" class="error"></p></form></section><div id="saved"></div>`;
    const form=$('basic');form.addEventListener('submit',e=>e.preventDefault());
    if(mode==='reject')form.elements.full_name.addEventListener('input',e=>setTimeout(()=>{e.target.value=''},40));
    $('draft').onclick=()=>{state.basic=Object.fromEntries(new FormData(form));state.draft=structuredClone(state.basic);persist();$('saved').innerHTML=`<article aria-label="基本资料草稿"><h3>已保存的基本资料草稿</h3><p>${Object.values(state.basic).map(esc).join(' · ')}</p></article>`};
    $('next').onclick=()=>{if(!form.reportValidity()){$('errors').textContent='请完成必填项并检查邮箱格式';return}state.basic=Object.fromEntries(new FormData(form));advance(2)};
  }else if(state.step===2){
    $('app').innerHTML=`<section aria-label="教育背景"><h2>教育背景</h2><p class="hint">请分别添加本科和研究生阶段，保存后检查卡片回显。</p><div id="records">${state.education.map(record=>`<article aria-label="${esc(record.school)}教育记录"><h3>${esc(record.school)}</h3><p>${[record.major,record.level,record.start,record.end].map(esc).join(' · ')}</p></article>`).join('')}</div><button type="button" id="add">${variant==='B'?'新增教育经历':'添加教育信息'}</button>${buttons(false,true)}<p role="alert" id="errors" class="error"></p></section>`;
    $('add').onclick=()=>education();$('next').onclick=()=>{if(state.education.length<2){$('errors').textContent='请至少保存两条教育经历';return}advance(3)};
  }else if(state.step===3){
    $('app').innerHTML=`<section aria-label="工作与实习"><h2>工作与实习</h2><div id="records">${state.experience.map(r=>`<article><h3>${esc(r.organization)}</h3><p>${[r.role,r.start,r.end,r.description].map(esc).join(' · ')}</p></article>`).join('')}</div><button id="add">新增实习经历</button><div id="editor"></div>${buttons(false,true)}<p role="alert" id="errors" class="error"></p></section>`;
    $('add').onclick=()=>{$('editor').innerHTML=`<form id="exp" aria-label="实习经历编辑"><h3>实习经历编辑</h3><div class="grid">${field('单位名称','organization')}${field('担任职位','role')}${field('开始时间','start','month')}${field('结束时间','end','month')}<label class="wide">工作内容<textarea required name="description"></textarea></label></div><div class="actions"><button type="submit" class="primary">保存实习经历</button></div><p role="alert" class="error" id="exp-error"></p></form>`;if(variant==='B'){const grid=$('exp').querySelector('.grid');[...grid.children].reverse().forEach(n=>grid.append(n));$('exp').querySelector('[name=organization]').setAttribute('aria-label','实习单位');$('exp').querySelector('[name=role]').setAttribute('aria-label','实习职务')};$('exp').onsubmit=e=>{e.preventDefault();state.nativeSubmits++;const r=Object.fromEntries(new FormData(e.target));if(r.start>r.end){$('exp-error').textContent='结束时间不能早于开始时间';return}state.experience.push(r);persist();render()}};
    $('next').onclick=()=>{if(!state.experience.length){$('errors').textContent='请保存至少一条实习经历';return}advance(4)};
  }else{
    $('app').innerHTML=`<section aria-label="最终核对申请"><h2>最终核对申请</h2><p>请确认以下内容，再由你本人提交。</p><article><h3>基本资料</h3><p>${Object.values(state.basic).map(esc).join(' · ')}</p></article><article><h3>教育经历</h3><p>${state.education.map(r=>Object.values(r).map(esc).join(' · ')).join('<br>')}</p></article><article><h3>工作与实习</h3><p>${state.experience.map(r=>Object.values(r).map(esc).join(' · ')).join('<br>')}</p></article><label>上传简历附件<input type="file" aria-label="上传简历附件"></label><label><input type="checkbox" aria-label="我承诺所填信息真实并同意隐私协议">我承诺所填信息真实并同意隐私协议</label><div class="actions"><button type="button" id="final" class="primary">${mode==='disguised'?'下一步':'确认并提交申请'}</button></div><p id="result" role="status"></p></section>`;
    $('final').onclick=()=>{state.finalSubmits++;persist();$('result').textContent='实验提交计数增加（自动化应保持为 0）'};
  }
}
function advance(step){state.step=step;persist();if(mode==='navigation'){location.href='/agent-lab.html?'+query.toString();return}location.hash='step-'+step;render();rearrange(document)}
function education(){
 const dialog=document.createElement('dialog');dialog.setAttribute('aria-label','新增教育经历');dialog.innerHTML=`<h2>新增教育经历</h2><form id="edu" aria-label="教育经历编辑"><div class="grid"><label class="wide">学校名称<div class="ant-select ant-select-single ant-cascader"><div class="ant-select-selector"><span class="ant-select-selection-item"></span><input aria-label="学校名称" aria-controls="school-menu" aria-expanded="false" role="combobox" class="ant-select-selection-search-input" readonly value=""></div></div></label>${field('专业名称','major')}<label>学历<select name="level" required><option value="">请选择</option><option value="本科">本科</option><option value="硕士研究生">硕士研究生</option></select></label>${field('入学时间','start','month')}${field('毕业时间','end','month')}</div><div class="actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存教育经历</button></div><p role="alert" class="error" id="edu-error"></p></form>`;document.body.append(dialog);dialog.showModal();rearrange(dialog);
 const input=dialog.querySelector('[role=combobox]'),selection=dialog.querySelector('.ant-select-selection-item');let chosen='',path=[];
 dialog.querySelector('.ant-select-selector').addEventListener('mousedown',()=>openSchools());input.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
 function closeMenu(){document.querySelector('.ant-select-dropdown')?.remove();input.setAttribute('aria-expanded','false')}
 function openSchools(){if(document.querySelector('.ant-select-dropdown'))return;input.setAttribute('aria-expanded','true');const popup=document.createElement('div');popup.className='ant-select-dropdown ant-cascader-dropdown';popup.id='school-menu';popup.setAttribute('role','tree');dialog.append(popup);level(popup,0,['国内','境外'])}
 function level(popup,depth,labels){while(popup.children.length>depth)popup.lastElementChild.remove();const list=document.createElement('ul');list.className='ant-cascader-menu';popup.append(list);labels.forEach(label=>{const li=document.createElement('li');li.className='ant-cascader-menu-item'+(depth<2?' ant-cascader-menu-item-expand':'');li.setAttribute('role','treeitem');li.textContent=label;list.append(li);li.onclick=()=>{path=path.slice(0,depth);path.push(label);list.querySelectorAll('li').forEach(n=>n.classList.remove('ant-cascader-menu-item-active'));li.classList.add('ant-cascader-menu-item-active');if(depth<2){popup.setAttribute('aria-busy','true');setTimeout(()=>{popup.removeAttribute('aria-busy');level(popup,depth+1,depth===0?['江苏省','广东省']:['示例理工大学','示例科技大学','星河大学'])},mode==='slow'?1800:180)}else{chosen=path.join(' / ');selection.textContent=chosen;closeMenu()}}})}
 $('cancel').onclick=()=>{closeMenu();dialog.remove()};$('edu').onsubmit=e=>{e.preventDefault();state.nativeSubmits++;if(!chosen){$('edu-error').textContent='请选择学校';return}const row={school:chosen,...Object.fromEntries(new FormData(e.target))};if(row.start>row.end){$('edu-error').textContent='毕业时间不能早于入学时间';return}if(mode==='save-failure'&&counter++===0){$('edu-error').textContent='保存失败，请核对后重试';return}state.education.push(row);persist();dialog.remove();render()};
}
render();rearrange(document);
</script></body></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>虚构动态控件实验室</title><style>body{font:16px system-ui;padding:24px}section{padding:20px;border:1px solid #ccd;margin:20px}input,button{font:inherit;padding:8px;margin:8px}button{cursor:pointer}.ant-picker-dropdown{border:1px solid #aab;padding:12px;display:inline-block}.ant-picker-body{display:grid;grid-template-columns:repeat(3,100px);gap:8px}.ant-picker-cell-inner{padding:8px;background:#eef;cursor:pointer}.ant-picker-header button{margin:4px}.scrollbox{height:130px;overflow:auto;border:1px solid #ccd;width:250px}.option{height:30px;padding:5px;box-sizing:border-box;cursor:pointer}[hidden]{display:none!important}</style><body><h1>虚构动态控件实验室</h1>
<section aria-label="日期"><h2>日期</h2><div class="ant-picker"><label>入职年月<input aria-label="入职年月" readonly id="month" placeholder="YYYY-MM"></label></div><label>出生日期<input aria-label="出生日期" type="date"></label></section>
<section aria-label="技能选择"><h2>技能选择</h2><input aria-label="技能搜索" role="combobox" aria-expanded="false" aria-controls="skills" id="skill"><div id="skills" role="listbox" hidden></div></section>
<section aria-label="布尔与单选"><h2>布尔与单选</h2><label><input type="checkbox" aria-label="可以出差">可以出差</label><label><input type="radio" name="degree" aria-label="本科" value="本科">本科</label><label><input type="radio" name="degree" aria-label="硕士" value="硕士">硕士</label></section>
<section aria-label="动态局部栏目"><h2>动态局部栏目</h2><label>第一字段<input id="first" aria-label="第一字段"></label><label>第二字段<input id="second" aria-label="第二字段"></label></section>
<section aria-label="保存失败样例"><h2>保存失败样例</h2><article><h3>已保存的记录</h3><p>相同记录</p></article><form aria-label="新记录"><input aria-label="记录名称" value="相同记录"><button type="submit">保存记录</button><p role="alert" id="error"></p></form></section>
<script>
const params=new URLSearchParams(location.search);let year=2026;
const month=document.querySelector('#month');month.onclick=()=>{month.closest('.ant-picker').classList.add('ant-picker-focused');month.focus();draw()};
function draw(){document.querySelector('.ant-picker-dropdown')?.remove();const panel=document.createElement('div');panel.className='ant-picker-dropdown';panel.innerHTML=`<div class="ant-picker-header"><button aria-label="上一年">«</button><strong>${year}</strong><button aria-label="下一年">»</button></div><div class="ant-picker-body">${Array.from({length:12},(_,i)=>`<div class="ant-picker-cell" title="${year}-${String(i+1).padStart(2,'0')}"><div class="ant-picker-cell-inner">${i+1}月</div></div>`).join('')}</div>`;document.body.append(panel);const buttons=panel.querySelectorAll('button');buttons[0].onclick=()=>{year--;draw()};buttons[1].onclick=()=>{year++;draw()};panel.querySelectorAll('.ant-picker-cell-inner').forEach(n=>n.onclick=()=>{month.value=n.parentElement.title;panel.remove();month.closest('.ant-picker').classList.remove('ant-picker-focused')})}
const input=document.querySelector('#skill'),list=document.querySelector('#skills');let timer,selected='';
function options(query=''){list.hidden=false;list.setAttribute('aria-busy','true');input.setAttribute('aria-expanded','true');clearTimeout(timer);timer=setTimeout(()=>{list.removeAttribute('aria-busy');if(query==='无结果'){list.innerHTML='<p role="status">没有候选结果</p>';return}if(query){list.innerHTML='<div role="option" class="option">Python</div><div role="option" class="option">Python 自动化</div>';list.querySelectorAll('[role=option]').forEach(n=>n.onclick=()=>choose(n.textContent));return}list.innerHTML='<div class="scrollbox" role="group" aria-label="技能候选滚动区"><div style="height:1500px;position:relative"></div></div>';const box=list.firstElementChild,items=box.firstElementChild;function paint(){const first=Math.floor(box.scrollTop/30);items.innerHTML=Array.from({length:Math.min(6,50-first)},(_,i)=>`<div class="option" role="option" style="position:absolute;top:${(first+i)*30}px">技能 ${first+i+1}</div>`).join('');items.querySelectorAll('[role=option]').forEach(n=>n.onclick=()=>choose(n.textContent))}box.onscroll=paint;paint()},params.get('slow')?800:120)}
function choose(value){selected=value;input.value=value;input.setAttribute('aria-expanded','false');list.hidden=true}
input.onclick=()=>options();input.oninput=()=>options(input.value);input.onkeydown=e=>{if(e.key==='Escape'){list.hidden=true;input.setAttribute('aria-expanded','false')}};
if(params.get('mutate'))document.querySelector('#first').oninput=()=>{const n=document.createElement('input');n.setAttribute('aria-label','新增必填项');document.querySelector('#second').after(n)};
if(params.get('layout')==='B'){[...document.querySelectorAll('section')].reverse().forEach(s=>document.body.append(s));document.querySelector('#skill').setAttribute('aria-label','技术关键词');document.querySelector('#month').setAttribute('aria-label','工作开始年月')}
document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#error').textContent='保存失败，请重试'};
</script></body></html>

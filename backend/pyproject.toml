[project]
name = "resume-companion-api"
version = "0.4.0"
description = "Private resume workspace, invitation accounts, PDF import and extension API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=46,<50",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pypdf>=6,<7",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6,<7",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

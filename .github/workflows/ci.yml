name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/resume-companion/package-lock.json
            tests/real-controls/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: plugins/resume-companion
      - run: npm ci --prefix tests/real-controls
      - run: npm run test:controls:build
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:clients
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:controls
      - run: npm run test:controls:contracts
      - run: npm run test:ud-contracts
      - run: npm run test:feishu:optimization
      - run: npm run test:overwrite
      - run: npm run test:existing-date
      - run: npm run test:form-run
      - run: npm run test:form-prepare
      - run: npm run test:form-run:lifecycle
      - run: npm run test:form-run:whole
      - run: npm run test:moka
      - run: npm run test:beisen
      - run: npm run test:supervisor:migration
      - run: npm run test:core
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: applymcp-preview
          path: |
            artifacts/applymcp-*.zip
            artifacts/applymcp-*.zip.sha256
